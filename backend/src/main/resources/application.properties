spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:sqlite:student_assist.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

tranzy.base-url=https://api.tranzy.ai/v1/opendata
tranzy.api-key=${TRANZY_API_KEY}
tranzy.api-key-header=X-API-KEY
tranzy.agency-id=${TRANZY_AGENCY_ID:2}
tranzy.vehicles-cache-ttl=20s
tranzy.static-cache-ttl=30m
