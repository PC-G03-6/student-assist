spring.application.name=backend

spring.datasource.url=jdbc:sqlite:student_assist.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configurare scraper orar UBB FMI
studentassist.schedule.base-url=https://www.cs.ubbcluj.ro/files/orar
studentassist.schedule.configuration-id=
studentassist.schedule.timeout-ms=15000
studentassist.schedule.request-delay-ms=100
